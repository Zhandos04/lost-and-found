{% extends 'base.html' %}
{% block title %}Выход{% endblock %}

{% block content %}
<div class="row">

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Выход из аккаунта</h3>
            </div>
            <div class="card-body">
                <div class="alert alert-success">
                    Вы успешно вышли из аккаунта.
                </div>
                <a href="{% url 'login' %}" class="btn btn-outline-primary">Войти снова</a>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
